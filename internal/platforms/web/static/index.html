<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Orbiter</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2040%2040%27%3E%3Cg%20opacity=%27.24%27%3E%3Ccircle%20cx=%2720%27%20cy=%2720%27%20r=%2717%27%20fill=%27%23d0c3c6%27/%3E%3Ccircle%20cx=%2714%27%20cy=%2713%27%20r=%272.6%27%20fill=%27%23000%27%20opacity=%27.45%27/%3E%3Ccircle%20cx=%2727.5%27%20cy=%2716.5%27%20r=%271.8%27%20fill=%27%23000%27%20opacity=%27.4%27/%3E%3Ccircle%20cx=%2718.5%27%20cy=%2729%27%20r=%273.2%27%20fill=%27%23000%27%20opacity=%27.4%27/%3E%3C/g%3E%3Cg%20transform=%27rotate(-14%2020%2020)%27%3E%3Cpath%20d=%27M20%2015V8.5%27%20stroke=%27%23d0c3c6%27%20stroke-width=%271.4%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M16.5%209.5Q20%2012%2023.5%209.5%27%20fill=%27none%27%20stroke=%27%23d0c3c6%27%20stroke-width=%271.3%27%20stroke-linecap=%27round%27/%3E%3Ccircle%20cx=%2720%27%20cy=%277.5%27%20r=%271.8%27%20fill=%27%23d0c3c6%27/%3E%3Cpath%20d=%27M11%2020H16M24%2020H29%27%20stroke=%27%23d0c3c6%27%20stroke-width=%271.4%27%20stroke-linecap=%27round%27/%3E%3Crect%20x=%273.5%27%20y=%2714%27%20width=%277.5%27%20height=%2712%27%20rx=%271%27%20fill=%27%234B5782%27/%3E%3Crect%20x=%2729%27%20y=%2714%27%20width=%277.5%27%20height=%2712%27%20rx=%271%27%20fill=%27%234B5782%27/%3E%3Cpath%20d=%27M7.25%2015V25M4.5%2020H10M32.75%2015V25M30%2020H35%27%20fill=%27none%27%20stroke=%27%2322336F%27%20stroke-width=%271%27/%3E%3Crect%20x=%2716%27%20y=%2715%27%20width=%278%27%20height=%2710%27%20rx=%271.5%27%20fill=%27%23927418%27/%3E%3Cpath%20d=%27M17.2%2019.5H22.8%27%20stroke=%27%23d0c3c6%27%20stroke-width=%271%27%20opacity=%27.7%27/%3E%3C/g%3E%3C/svg%3E">

  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/ibm-plex-sans-400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/source-serif-4-400.woff2">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/vendor/github-dark.min.css">
  <link rel="stylesheet" href="/static/vendor/katex.min.css">

  <script defer src="/static/vendor/katex.min.js"></script>
  <script defer src="/static/vendor/auto-render.min.js"></script>
</head>
<body>
  <div id="app" class="app-shell">

    <!-- Mobile drawer backdrop -->
    <div id="mobile-backdrop" class="mobile-backdrop" onclick="closeLeftDrawer()"></div>

    <!-- ===================== Left sidebar ===================== -->
    <aside id="left-sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-wrap">
          <svg class="orbiter-logo" viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
            <g opacity=".24">
              <circle cx="20" cy="20" r="17" fill="#d0c3c6"/>
              <circle cx="14" cy="13" r="2.6" fill="#000" opacity=".45"/>
              <circle cx="27.5" cy="16.5" r="1.8" fill="#000" opacity=".4"/>
              <circle cx="18.5" cy="29" r="3.2" fill="#000" opacity=".4"/>
            </g>
            <g transform="rotate(-14 20 20)">
              <path d="M20 15V8.5" stroke="#d0c3c6" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M16.5 9.5Q20 12 23.5 9.5" fill="none" stroke="#d0c3c6" stroke-width="1.3" stroke-linecap="round"/>
              <circle cx="20" cy="7.5" r="1.8" fill="#d0c3c6"/>
              <path d="M11 20H16M24 20H29" stroke="#d0c3c6" stroke-width="1.4" stroke-linecap="round"/>
              <rect x="3.5" y="14" width="7.5" height="12" rx="1" fill="#4B5782"/>
              <rect x="29" y="14" width="7.5" height="12" rx="1" fill="#4B5782"/>
              <path d="M7.25 15V25M4.5 20H10M32.75 15V25M30 20H35" fill="none" stroke="#22336F" stroke-width="1"/>
              <rect x="16" y="15" width="8" height="10" rx="1.5" fill="#927418"/>
              <path d="M17.2 19.5H22.8" stroke="#d0c3c6" stroke-width="1" opacity=".7"/>
            </g>
          </svg>
          <span class="sidebar-title">Orbiter</span>
          <span id="sync-pill" class="sync-pill connecting" title="WebSocket connection status">
            <span class="sync-dot"></span>
            <span id="sync-label">connecting…</span>
          </span>
        </div>
        <button type="button" class="icon-btn lg-hidden" onclick="closeLeftDrawer()" title="Close sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-search">
        <input id="agent-search" type="text" oninput="renderAgentList()" placeholder="Filter agents…" autocomplete="off">
      </div>

      <div id="agent-list" class="agent-list"></div>

      <div class="sidebar-footer">
        <button id="reasoning-toggle-btn" type="button" class="theme-toggle" onclick="toggleReasoning()" title="Show or hide reasoning">
          <span class="theme-toggle-left">
            <svg class="icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 3a3.5 3.5 0 00-3.2 4.9A3.5 3.5 0 005 14.5 3.5 3.5 0 008.5 18H11V3H9.5zM14.5 3a3.5 3.5 0 013.2 4.9A3.5 3.5 0 0119 14.5 3.5 3.5 0 0115.5 18H13V3h1.5z"/>
            </svg>
            <span>Show reasoning</span>
          </span>
          <span id="reasoning-state" class="toggle-state mono on">On</span>
        </button>
      </div>
    </aside>

    <!-- ===================== Main chat ===================== -->
    <main class="main">
      <button id="menu-fab" type="button" class="menu-fab lg-hidden" onclick="toggleLeftDrawer()" title="Open agents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
      </button>

      <div id="chat" class="chat-scroll" aria-live="polite">
        <div id="chat-messages-inner" class="chat-inner"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer-inner">
          <div id="cmd-popup" class="cmd-popup hidden" role="listbox" aria-label="Command suggestions"></div>
          <form id="composer" class="composer">
            <input id="file-input" type="file" accept="image/*" multiple hidden>
            <div id="attachment-previews" class="attachment-previews hidden" aria-label="Attached images"></div>
            <button id="attach-btn" type="button" class="attach-btn" onclick="openFilePicker()" title="Attach files">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
            <textarea id="prompt" rows="1" placeholder="Send a message…" autocomplete="off"></textarea>
            <button id="send-btn" type="button" aria-label="Send message">
              <span class="send-face send-face--send">
                <span>Send</span>
              </span>
              <span class="send-face send-face--stop" aria-hidden="true">
                <span>Stop</span>
              </span>
            </button>
          </form>
          <div class="status-line">
            <div id="working-indicator-pill" class="state-pill idle" title="Working state: idle / busy / compressing">
              <span id="working-indicator-visual" class="state-visual"></span>
              <span id="working-indicator-state" class="mono" role="status">idle</span>
            </div>
            <div class="token-wrap">
              <div id="header-token-badge" class="token-badge">
                <span class="muted hide-sm">Tokens:</span>
                <span id="header-token-count" class="mono strong">0</span>
              </div>
              <div class="token-tooltip">
                <div class="tooltip-title">Conversation</div>
                <div class="tooltip-row"><span>Words:</span><span id="tooltip-word-count" class="strong">0</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Confirmation modal -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-body">
        <h3 id="confirm-modal-title" class="modal-title">Clear history?</h3>
        <p id="confirm-modal-desc" class="modal-desc">All messages in this chat will be deleted.</p>
      </div>
      <div class="modal-actions">
        <button type="button" id="confirm-modal-cancel" class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
        <button type="button" id="confirm-modal-action" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <div id="icon-picker-popover" class="popover hidden" onclick="event.stopPropagation()">
    <div class="popover-header">
      <div>
        <div class="popover-title">Define agent icon</div>
        <div class="popover-subtitle">Leave empty = automatic initials</div>
      </div>
      <button type="button" class="popover-reset" onclick="resetAgentVisuals()" title="Reset to default">Reset</button>
    </div>

    <div>
      <div class="popover-label-row">
        <span class="mono-label">Icon presets</span>
        <button type="button" class="link-btn" onclick="selectPresetIcon('')">Auto (initials)</button>
      </div>
      <div id="icon-preset-grid" class="preset-grid"></div>
    </div>

    <div>
      <label for="custom-icon-input" class="mono-label block-label">Custom (empty, emoji, key, URL or SVG)</label>
      <input id="custom-icon-input" type="text" oninput="applyCustomIconInput(this.value)" placeholder="Empty for initials, bot, 🤖…" class="custom-icon-input">
    </div>
  </div>

  <div id="agent-menu-pop" class="agent-menu-pop" hidden>
    <button type="button" class="agent-menu-item" data-action="icon">Change icon</button>
    <button type="button" class="agent-menu-item" data-action="clear">Clear history</button>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script defer src="/static/vendor/marked.min.js"></script>
  <script defer src="/static/vendor/purify.min.js"></script>
  <script defer src="/static/vendor/highlight.min.js"></script>
  <script defer src="/static/util.js"></script>
  <script defer src="/static/render.js"></script>
  <script defer src="/static/image.js"></script>
  <script defer src="/static/agents.js"></script>
  <script defer src="/static/commands.js"></script>
  <script defer src="/static/stream.js"></script>
  <script defer src="/static/connection.js"></script>
  <script defer src="/static/app.js"></script>
</body>
</html>
